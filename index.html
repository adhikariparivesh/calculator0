<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parivesh Education | </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <style>
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .nav-link {
      position: relative;
    }
    .nav-link:after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -2px;
      left: 0;
      background-color: #2563eb;
      transition: width 0.3s;
    }
    .nav-link:hover:after {
      width: 100%;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">

  <!-- Navbar -->
  <nav class="bg-white dark:bg-gray-900 border-b sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">P</div>
        <div>
          <h1 class="text-2xl font-bold">Parivesh Education</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">Notes Hub</p>
        </div>
      </div>

      <div class="flex items-center gap-6">
        <button id="theme-toggle" class="p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800">
          <i class="fas fa-moon text-xl"></i>
        </button>
        <button onclick="showAdminModal()" 
                class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl flex items-center gap-2 text-sm font-medium">
          <i class="fas fa-cog"></i> Admin
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white py-28">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h2 class="text-5xl md:text-6xl font-bold leading-tight">Quality Notes for<br>Students</h2>
      <p class="mt-6 text-xl text-blue-100 max-w-2xl mx-auto">
        Well-organized, chapter-wise notes with direct OneDrive access.
      </p>
      <button onclick="document.getElementById('notes-section').scrollIntoView({ behavior: 'smooth' })" 
              class="mt-10 px-8 py-4 bg-white text-blue-700 font-semibold rounded-2xl text-lg hover:bg-gray-100 transition">
        Browse All Notes →
      </button>
    </div>
  </section>

  <!-- Notes Section -->
  <section id="notes-section" class="py-16">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
        <h2 class="text-4xl font-bold">Chapter-wise Notes</h2>
        
        <div class="flex w-full md:w-auto gap-3">
          <input type="text" id="search" 
                 placeholder="Search any chapter or topic..." 
                 class="flex-1 px-6 py-4 rounded-3xl border border-gray-300 dark:border-gray-700 dark:bg-gray-900 focus:outline-none focus:border-blue-500"/>
        </div>
      </div>

      <!-- Subjects Tabs -->
      <div id="subjects-tabs" class="flex flex-wrap gap-3 mb-10"></div>

      <!-- Chapters Grid -->
      <div id="chapters-grid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
    </div>
  </section>

  <!-- Admin Modal -->
  <div id="admin-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center">
    <div class="bg-white dark:bg-gray-900 rounded-3xl w-full max-w-lg mx-4">
      <div class="p-8">
        <h3 class="text-2xl font-bold mb-6">Admin Panel</h3>
        <input type="password" id="admin-password" placeholder="Enter Password" 
               class="w-full px-5 py-4 rounded-2xl border dark:bg-gray-800 mb-6 text-lg"/>
        
        <div id="admin-panel" class="hidden space-y-6">
          <p class="text-green-600 font-medium">✅ Access Granted</p>
          <div class="bg-gray-100 dark:bg-gray-800 p-5 rounded-2xl text-sm">
            <strong>How to add new notes:</strong><br>
            Edit the <code>notesData</code> object in the script section of this file.<br><br>
            Then refresh the page.
          </div>
        </div>

        <button onclick="hideAdminModal()" 
                class="mt-6 w-full py-4 bg-gray-200 dark:bg-gray-700 rounded-2xl font-medium">
          Close
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==================== DATA ====================
    let notesData = {
      "Class X": [
        {
          id: 1,
          chapter: "Data Communication and Networking",
          desc: "Sharing and connecting information between devices",
          link: "https://1drv.ms/w/c/497b24478e3e5744/IQBp4e6HClpjTa79howfcyS7AY5e8rHgz5gHJyuucmmOnJI?e=JVZwhU",
          date: "2026-05-22"
        },
        {
          id: 2,
          chapter: "AI and Contemporary Technology",
          desc: "AI and Its Importance",
          link: "https://1drv.ms/w/c/497b24478e3e5744/IQAeawx_cgeNRoV-L-PvA-f6AQCN2wE9Ynpwvvao0Yecbj4?e=fAhWZU",
          date: "2026-05-29"
        },
         {
          id: 3,
          chapter: "Multimedia",
          desc: "Text,Audio,Graphics,Videos & Animation",
          link: "https://1drv.ms/w/c/497b24478e3e5744/IQBaS7jWe109QKVSjuJhdYM9Aeeg5bD3iHnNH5YVEmGSQNM?e=SYakfO",
          date: "2026-06-18"
        }
      ],
      "Class IX": [
        {
          id: 1,
          chapter: "Book PDF",
          desc: "Computer Science.",
          link: "https://1drv.ms/b/c/497b24478e3e5744/IQDyae6FiV3gRZpTBV-hA3OeAcGjawZqfFh6j4MPJ51l140?e=UreOm3",
          date: "2026-04-28"
        },
          {
          id: 2,
          chapter: "Internet and Social Media",
          desc: "Communication",
          link: "https://1drv.ms/p/c/497b24478e3e5744/IQCOjxjO0ziyQ5I_h4Cn9uPSAcT8IAZurgCLniFgDJgWx_o?e=XNXl83",
          date: "2026-04-28"
        },
      ],
      "Class VIII": [
        {
          id: 1,
          chapter: "Book PDF",
          desc: "Computer Science.",
          link: "https://onedrive.live.com/your-english-chapter1-link",
          date: "2026-05-10"
        }
      ]
    };

    let currentSubject = "Science";

    // ==================== THEME ====================
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // ==================== RENDER FUNCTIONS ====================
    function renderSubjects() {
      const container = document.getElementById('subjects-tabs');
      container.innerHTML = '';

      Object.keys(notesData).forEach(subject => {
        const isActive = subject === currentSubject;
        const btn = document.createElement('button');
        btn.className = `px-6 py-3 rounded-3xl font-medium transition ${isActive ? 
          'bg-blue-600 text-white' : 
          'bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700'}`;
        btn.textContent = subject;
        btn.onclick = () => {
          currentSubject = subject;
          renderSubjects();
          renderChapters();
        };
        container.appendChild(btn);
      });
    }

    function renderChapters() {
      const container = document.getElementById('chapters-grid');
      container.innerHTML = '';

      const chapters = notesData[currentSubject];

      chapters.forEach(ch => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-3xl p-6 card-hover";
        card.innerHTML = `
          <div class="flex justify-between">
            <h3 class="font-semibold text-lg">${ch.chapter}</h3>
            <span class="text-xs bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full">${ch.date}</span>
          </div>
          <p class="mt-4 text-gray-600 dark:text-gray-400 text-sm line-clamp-3">${ch.desc}</p>
          
          <div class="mt-6 flex gap-3">
            <a href="${ch.link}" target="_blank" 
               class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-center py-3.5 rounded-2xl font-medium transition">
              View Notes
            </a>
            <button onclick="copyLink('${ch.link}')" 
                    class="px-6 border border-gray-300 dark:border-gray-600 rounded-2xl hover:bg-gray-100 dark:hover:bg-gray-800">
              <i class="fas fa-copy"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function copyLink(link) {
      navigator.clipboard.writeText(link).then(() => {
        alert("✅ Link copied to clipboard!");
      });
    }

    // Search Functionality
    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('#chapters-grid > div');
      
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(term) ? 'block' : 'none';
      });
    });

    // Admin Modal
    function showAdminModal() {
      document.getElementById('admin-modal').classList.remove('hidden');
      document.getElementById('admin-password').focus();
    }

    function hideAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
      document.getElementById('admin-password').value = '';
    }

    // Admin Password Check (Change this password)
    document.getElementById('admin-password').addEventListener('keypress', function(e) {
      if (e.key === "Enter") {
        if (this.value === "admin123") {
          document.getElementById('admin-panel').classList.remove('hidden');
        } else {
          alert("Incorrect Password!");
        }
      }
    });

    // Initialize
    window.onload = () => {
      renderSubjects();
      renderChapters();
    };
  </script>
</body>
</html>
